<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1d0f0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Notas">
<title>Notas</title>
<link rel="manifest" href="/notas/manifest.json">
<link rel="apple-touch-icon" href="/notas/icone-192.png">
<link rel="icon" href="/notas/icone-192.png">
<style>
  :root{--bg:#1d0f0a;--panel:#2b1710;--ink:#f3e9df;--muted:#b9a596;--accent:#c8862f;--line:#4a2b1f}
  *{box-sizing:border-box;margin:0;padding:0}
  button{background:#3b2117;color:var(--ink);border:1px solid #5a3424;border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer;white-space:nowrap;font-family:inherit}
  button:hover{background:#4a2a1d}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.pri{background:var(--accent);border-color:var(--accent);color:#1d0f0a;font-weight:600}
  .hidden{display:none!important}
  input,textarea{font-family:inherit}
  button.back{font-size:13px}
  .newRow{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
  .newRow input:not([type=file]){flex:1;min-width:200px;background:#2f1a12;border:2px solid #5a3424;border-radius:10px;color:var(--ink);font-size:15px;padding:10px 12px}
  .newRow input:focus{outline:none;border-color:var(--accent)}
  .newRow input[type=file]{display:none}
  #secBody h4{margin:18px 0 8px;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:10px}
  .item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
  .item .txt{flex:1;word-break:break-word}
  .item a.txt{color:#e9c27a;text-decoration:none}
  .item a.txt:hover{text-decoration:underline}
  .item.done .txt{opacity:.55;text-decoration:line-through}
  .item input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
  button.x,button.mini{padding:2px 8px;font-size:12px}
  .aviso{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#3a2a12;border:1px solid #8a6a2a;border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:14px}
  .aviso span{flex:1;min-width:220px}
  .mesNav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
  .mesNav h3{font-size:20px;min-width:190px;text-align:center}
  .mesNav button{font-size:18px;padding:4px 14px}.mesNav button.mini{font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:6px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
  .kpi small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}.kpi b{font-size:18px}
  .kpi.ok b{color:#9fd39a}.kpi.warn b{color:#e9c27a}.kpi.bad b{color:#f0948f}.kpi.bad{border-color:#8a3a33}
  .item .valor{font-variant-numeric:tabular-nums;white-space:nowrap}
  .item.vencida{border-color:#8a3a33;background:#3a1a14}.item.vencida .quando{color:#f0948f;font-weight:600}
  .item .tag{font-size:11px;color:#4fb3a9;border:1px solid #4fb3a9;border-radius:999px;padding:1px 7px;margin-left:8px;white-space:nowrap}
  .nTopo{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.nFoto{font-size:16px;padding:11px 18px}
  .nAbas{display:flex;gap:6px;flex-wrap:wrap}.nAbas button.on{background:#e0b84a;border-color:#e0b84a;color:#1d0f0a;font-weight:600}
  .nLinha{cursor:pointer}.nLinha .txt{min-width:0}.nLinha .txt b{display:block;overflow-wrap:anywhere}.nLinha small{color:var(--muted);font-size:12.5px}
  .nSit{font-size:11.5px;border:1px solid;border-radius:999px;padding:2px 8px;white-space:nowrap}.nSit.ok{color:#9fd39a}.nSit.warn{color:#e9c27a}.nSit.bad{color:#f0948f}
  .nGrupo{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.nGrupoT{display:flex;justify-content:space-between;gap:10px;font-size:16px;font-weight:600;margin-bottom:8px}
  .nAcoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}.nAcoes small{color:var(--muted)}
  .nMais{margin-top:12px}.nMais summary{cursor:pointer;color:var(--muted);font-size:13.5px;padding:6px 0}.nAcoes .mini{font-size:12px;padding:5px 9px}
  .nRapida{margin-bottom:14px}.nGrande{width:100%;font-size:20px;padding:22px 16px;border-radius:14px}
  .nMissao{padding:4px 8px;font-size:13px}.nMissao.tem{border-color:#e0b84a;color:#e0b84a}
  .nFundo{position:fixed;inset:0;background:rgba(10,5,3,.75);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:18px 10px;overflow:auto}
  .nCaixa{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;width:100%;max-width:640px}
  .nCab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.nCab h3{font-size:18px}
  .nFotos{display:flex;gap:8px;flex-wrap:wrap}.nFotos button{padding:11px 14px;font-size:14px}.nMinis{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  .nMini{position:relative;width:84px;height:108px;border-radius:10px;border:1px solid var(--line);background:#1d0f0a center/cover;display:flex;align-items:center;justify-content:center;font-size:26px;cursor:pointer}.nMini button{position:absolute;top:-7px;right:-7px;border-radius:99px;padding:2px 7px;font-size:11px}
  .nLendo{color:#e9c27a;font-size:13.5px;margin-bottom:8px}
  .nQuem{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 12px}.nQuem button{padding:12px 8px;font-size:14px;white-space:normal}.nQuem button.on{background:#e0b84a;border-color:#e0b84a;color:#1d0f0a;font-weight:700}
  .nCampos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.nCampos label{display:grid;gap:4px;min-width:0}.nCampos label>span{font-size:12px;color:var(--muted)}.nLargo{grid-column:1/-1}
  .nCampos input,.nCampos select,.nCampos textarea{width:100%;min-width:0;background:#2f1a12;border:1px solid #5a3424;border-radius:9px;color:var(--ink);font-size:16px;padding:10px;font-family:inherit;color-scheme:dark}.nCampos :focus{outline:none;border-color:#e0b84a}
  .nRodape{display:flex;justify-content:space-between;gap:8px;margin-top:14px}.nRodape button{padding:11px 16px;font-size:14px}.nApagar{color:#f0948f}
  .nVer{position:fixed;inset:0;background:#000d;z-index:80;overflow:auto;padding:14px;text-align:center}.nVer img{max-width:100%;background:#fff}.nVer button{position:fixed;top:12px;right:12px;font-size:18px}
  .nQuadro{position:relative;display:block;width:fit-content;max-width:100%;margin:0 auto;touch-action:none;line-height:0}.nTela{max-width:100%;max-height:62vh;border-radius:8px;display:block}.nQuadro svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.nQuadro polygon{fill:rgba(224,184,74,.18);stroke:#e0b84a;stroke-width:3;vector-effect:non-scaling-stroke}
  .nCanto{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;border:3px solid #e0b84a;background:rgba(29,15,10,.45);touch-action:none;cursor:grab}
  @media(max-width:560px){.nFundo{padding:0}.nCaixa{border-radius:0;min-height:100%;border:0}.nCampos{grid-template-columns:1fr}.nLinha{flex-wrap:wrap}.nLinha .txt{flex:1 1 62%}}
  .empty{color:var(--muted);font-size:14px;padding:20px 0}
  .hint{font-size:12px;color:var(--muted);line-height:1.5}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--accent);color:#1d0f0a;padding:8px 16px;border-radius:8px;font-weight:600;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:40;max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  input[type=file]{display:none}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #sec{max-width:820px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 60px}
  .cabeca{display:flex;align-items:center;gap:10px;margin-bottom:14px}.cabeca h1{font-size:24px;flex:1}.cabeca a{color:var(--muted);font-size:13px}
  #secBody h4{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px}
</style>
</head>
<body>
<div id="sec"><div class="cabeca"><h1>🧾 Notas</h1><a href="/#/">Produtividade</a></div><div id="secBody"></div></div>
<div id="toast"></div>
<script>
// o mínimo da Produtividade para a tela de notas funcionar sozinha, sem baixar os mapas
const PASSKEY = 'mapas-senha', $ = (id) => document.getElementById(id), CLOUD = { anexos: true }; let CUR = null, SENHA = localStorage.getItem(PASSKEY) || '', CAN_EDIT = !!SENHA, tt;
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6), itens = () => [], salvarSec = () => {}, showHub = () => {};
function toast(t) { const e = $('toast'); e.textContent = t; e.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => e.classList.remove('show'), 2600); }
const el = (tag, attrs = {}, ...filhos) => { const e = document.createElement(tag); for (const [k, v] of Object.entries(attrs)) { if (k.startsWith('on')) e[k] = v; else if (k === 'class') e.className = v; else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v); } filhos.flat().forEach((f) => f != null && e.append(f)); return e; };
const BRL = (v) => (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' }), hojeIso = () => new Date().toLocaleDateString('sv-SE');
const nomeMes = (m) => { const [a, mm] = m.split('-').map(Number); const t = new Date(a, mm - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }); return t[0].toUpperCase() + t.slice(1); };
const somaMes = (m, d) => { const [a, mm] = m.split('-').map(Number); const x = new Date(a, mm - 1 + d, 1); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`; };
const lerValor = (t) => { const v = parseFloat(String(t || '').replace(/[^\d,.-]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.')); return isFinite(v) ? Math.round(v * 100) / 100 : null; };
function showSec() { const b = $('secBody'); b.innerHTML = ''; renderNotas(b); }
function notasSaiu() { SENHA = ''; CAN_EDIT = false; NOTAS = null; localStorage.removeItem(PASSKEY); }
async function login() { const s = prompt('Senha (só desta vez neste aparelho):'); if (!s) return; SENHA = s; CAN_EDIT = true; notasErro = ''; NOTAS = null; await carregarNotas(); if (NOTAS) { localStorage.setItem(PASSKEY, s); toast('Pronto!'); } else { toast(notasErro || 'Senha incorreta'); notasSaiu(); notasErro = ''; } showSec(); }
if (location.hash !== '#/s/notas') history.replaceState(null, '', '#/s/notas');
</script>
<script src="/notas.js"></script>
<script>showSec(); if ('serviceWorker' in navigator) navigator.serviceWorker.register('/notas/sw.js').catch(() => {});</script>
</body>
</html>
